<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="theme-color" content="#111827"/>
<title>Personal Finance Hub</title>
<style>
:root{--bg:#f6f7fb;--panel:#fff;--text:#172033;--muted:#667085;--line:#e6e8ef;--brand:#172554;--brand2:#2f3f76;--gold:#c79a43;--good:#0f8a64;--bad:#c0392b;--shadow:0 10px 35px rgba(23,32,51,.07);--radius:18px}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:250px;background:#111827;color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}.logo{font-weight:800;letter-spacing:.03em;font-size:20px;padding:6px 10px}.logo small{display:block;font-size:10px;letter-spacing:.16em;color:#c7cbd7;margin-top:4px}.nav{display:flex;flex-direction:column;gap:6px}.nav button{border:0;background:transparent;color:#cbd5e1;text-align:left;padding:11px 12px;border-radius:12px}.nav button.active,.nav button:hover{background:#1f2937;color:#fff}.sidebar-foot{margin-top:auto}.main{flex:1;padding:28px;min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.topbar h1{margin:0;font-size:28px}.user-pill{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#e9edf7;color:var(--brand);font-weight:800}.grid{display:grid;gap:16px}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}.metric .label{color:var(--muted);font-size:13px}.metric .value{font-size:29px;font-weight:800;margin-top:8px}.metric .sub{font-size:12px;color:var(--muted);margin-top:6px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.card-head h3{margin:0;font-size:16px}.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700}.btn-primary{background:var(--brand);color:#fff}.btn-secondary{background:#eef1f7;color:var(--text)}.btn-danger{background:#fff1f0;color:var(--bad)}.btn-small{padding:7px 10px;font-size:12px}.rate{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}.rate .big{font-size:34px;font-weight:800}.badge{font-size:11px;padding:5px 8px;border-radius:999px;background:#eef7f4;color:var(--good);font-weight:700}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;white-space:nowrap}.table th{color:var(--muted);font-weight:700}.pos{color:var(--good)}.neg{color:var(--bad)}.muted{color:var(--muted)}.progress{height:9px;background:#edf0f5;border-radius:999px;overflow:hidden}.progress>div{height:100%;background:var(--gold);border-radius:999px}.empty{padding:24px;text-align:center;color:var(--muted)}.form{display:grid;gap:12px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--text)}.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;padding:20px;z-index:20}.modal{width:min(560px,100%);background:#fff;border-radius:20px;padding:22px;box-shadow:0 25px 80px rgba(0,0,0,.18)}.modal h2{margin:0 0 14px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}.auth{min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#111827,#1f315f);padding:20px}.auth-card{width:min(430px,100%);background:#fff;border-radius:24px;padding:30px;box-shadow:0 30px 90px rgba(0,0,0,.24)}.auth-card h1{margin:0 0 6px}.auth-card p{margin:0 0 24px;color:var(--muted)}.auth-toggle{display:flex;background:#f1f3f7;border-radius:12px;padding:4px;margin-bottom:18px}.auth-toggle button{flex:1;border:0;background:transparent;padding:9px;border-radius:9px}.auth-toggle .active{background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.08);font-weight:800}.notice{padding:10px 12px;border-radius:10px;background:#fff8e7;color:#8a621d;font-size:12px}.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;border-radius:12px;padding:12px 16px;z-index:50;box-shadow:var(--shadow)}.mobile-menu{display:none}.section-title{font-size:14px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:22px 0 10px}@media(max-width:1050px){.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}.sidebar{width:220px}}@media(max-width:760px){.sidebar{position:fixed;left:-270px;z-index:30;transition:left .2s;width:250px}.sidebar.open{left:0}.main{padding:18px}.mobile-menu{display:inline-flex}.grid-4,.grid-3,.grid-2,.form-grid{grid-template-columns:1fr}.topbar h1{font-size:22px}.hide-mobile{display:none}}
</style>
</head>
<body><div id="root"></div>
<script type="module" src="/app.js"></script>
</body></html>
