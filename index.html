<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#111827"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Finance Hub"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="/icon.svg"/>
<title>Personal Finance Hub</title>
<style>
:root{--bg:#eef2f8;--panel:rgba(255,255,255,.88);--text:#172033;--muted:#667085;--line:rgba(230,232,239,.9);--brand:#172554;--brand-2:#243b7a;--gold:#c79a43;--good:#0f8a64;--bad:#c0392b;--shadow:0 14px 42px rgba(23,32,51,.10);--radius:18px}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;pointer-events:none;z-index:-2;border-radius:999px;filter:blur(60px);opacity:.6;mix-blend-mode:screen}
body::before{width:58vw;height:58vw;right:-18vw;top:-22vw;background:radial-gradient(circle at 40% 40%,rgba(91,126,255,.45),rgba(91,126,255,0) 68%);animation:finance-orb-a 16s ease-in-out infinite alternate}
body::after{width:52vw;height:52vw;left:-18vw;bottom:-20vw;background:radial-gradient(circle at 58% 44%,rgba(44,196,146,.28),rgba(44,196,146,0) 68%);animation:finance-orb-b 21s ease-in-out infinite alternate}
body{background-image:linear-gradient(rgba(255,255,255,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.22) 1px,transparent 1px);background-size:44px 44px}
@keyframes finance-orb-a{from{transform:translate3d(-2vw,2vh,0) scale(1)}to{transform:translate3d(4vw,8vh,0) scale(1.15)}}
@keyframes finance-orb-b{from{transform:translate3d(0,-2vh,0) scale(1)}to{transform:translate3d(7vw,-7vh,0) scale(1.12)}}
@media(prefers-reduced-motion:reduce){body::before,body::after{animation:none}}
button,input,select{font:inherit}button{cursor:pointer}
.app{display:flex;min-height:100vh;background:transparent}
.sidebar{width:258px;background:linear-gradient(180deg,#0f172a 0%,#111827 55%,#0b1220 100%);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;box-shadow:18px 0 45px rgba(15,23,42,.14);z-index:20}
.logo{font-weight:800;letter-spacing:.035em;font-size:20px;padding:8px 10px}.logo small{display:block;font-size:10px;letter-spacing:.16em;color:#aab4c7;margin-top:4px}
.nav{display:flex;flex-direction:column;gap:5px;flex:1;min-height:0;overflow:auto;padding-right:3px}.nav button{border:0;background:transparent;color:#cbd5e1;text-align:left;padding:11px 12px;border-radius:12px;font-weight:600}.nav button.active,.nav button:hover{background:rgba(255,255,255,.08);color:#fff}.nav button[data-trash-bin]{margin-top:auto;color:#f6b5ae;background:rgba(192,57,43,.06)}.nav button[data-trash-bin]:hover{background:rgba(192,57,43,.14);color:#fff}
.nav-section-title{padding:13px 12px 4px;font-size:10px;line-height:1;text-transform:uppercase;letter-spacing:.14em;color:#7786a0;font-weight:800;pointer-events:none;user-select:none}.nav-section-title:first-child{padding-top:4px}
.sidebar-foot{margin-top:0}.sidebar-foot .btn{width:100%}
.main{flex:1;padding:28px;min-width:0;padding-bottom:max(28px,env(safe-area-inset-bottom));position:relative}
.main::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 80% 10%,rgba(255,255,255,.55),transparent 34%),radial-gradient(circle at 10% 80%,rgba(255,255,255,.42),transparent 28%);z-index:-1}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.topbar h1{margin:0;font-size:28px}.user-pill{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#e9edf7;color:var(--brand);font-weight:800}
.grid{display:grid;gap:16px}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.metric .label{color:var(--muted);font-size:13px}.metric .value{font-size:29px;font-weight:800;margin-top:8px}.metric .sub{font-size:12px;color:var(--muted);margin-top:6px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.card-head h3{margin:0;font-size:16px}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700}.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 8px 18px rgba(23,37,84,.18)}.btn-secondary{background:#eef1f7;color:var(--text)}.btn-danger{background:#fff1f0;color:var(--bad)}.btn-small{padding:7px 10px;font-size:12px}.rate{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}.rate .big{font-size:34px;font-weight:800}.badge{font-size:11px;padding:5px 8px;border-radius:999px;background:#eef7f4;color:var(--good);font-weight:700}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;white-space:nowrap}.table th{color:var(--muted);font-weight:700}.pos{color:var(--good)}.neg{color:var(--bad)}.muted{color:var(--muted)}.progress{height:9px;background:#edf0f5;border-radius:999px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#b58a35,#e2bc67);border-radius:999px}.empty{padding:24px;text-align:center;color:var(--muted)}
.form{display:grid;gap:12px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.96);color:var(--text)}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;padding:20px;z-index:20}.modal{width:min(560px,100%);background:#fff;border-radius:20px;padding:22px;box-shadow:0 25px 80px rgba(0,0,0,.18)}.modal h2{margin:0 0 14px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.auth{min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#111827,#1f315f);padding:20px}.auth-card{width:min(430px,100%);background:#fff;border-radius:24px;padding:30px;box-shadow:0 30px 90px rgba(0,0,0,.24)}.auth-card h1{margin:0 0 6px}.auth-card p{margin:0 0 24px;color:var(--muted)}.auth-toggle{display:flex;background:#f1f3f7;border-radius:12px;padding:4px;margin-bottom:18px}.auth-toggle button{flex:1;border:0;background:transparent;padding:9px;border-radius:9px}.auth-toggle .active{background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.08);font-weight:800}.notice{padding:10px 12px;border-radius:10px;background:#fff8e7;color:#8a621d;font-size:12px}.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;border-radius:12px;padding:12px 16px;z-index:50;box-shadow:var(--shadow)}.mobile-menu{display:none}
@media(max-width:1050px){.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}.sidebar{width:235px}}
@media(max-width:760px){.sidebar{position:fixed;left:-270px;z-index:30;transition:left .2s;width:258px;height:100dvh}.sidebar.open{left:0}.main{padding:18px;padding-bottom:calc(28px + env(safe-area-inset-bottom))}.mobile-menu{display:inline-flex}.grid-4,.grid-3,.grid-2,.form-grid{grid-template-columns:1fr}.topbar h1{font-size:22px}.hide-mobile{display:none}.table-wrap{margin-inline:-4px}.card{padding:16px;border-radius:16px}.nav-section-title{padding-top:12px}}
</style>
</head>
<body><div id="root"></div>
<script type="module" src="/app.js"></script>
<script type="module" src="/mobile-nav.js"></script>
<script type="module" src="/mobile-ui.js"></script>
<script type="module" src="/management-ui.js"></script>
<script type="module" src="/finance-management-v2.js"></script>
<script type="module" src="/income-tab.js"></script>
<script type="module" src="/debt-navigation-v3.js"></script>
<script type="module" src="/settings-csv-launcher.js"></script>
<script type="module" src="/trash-bin.js"></script>
<script type="module" src="/available-balance.js"></script>
<script type="module" src="/dashboard-current-totals.js"></script>
<script type="module" src="/navigation-polish.js"></script>
</body></html>
