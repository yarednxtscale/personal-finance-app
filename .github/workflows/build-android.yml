name: Build Finance Hub APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android CLI
        working-directory: .
        run: curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash

      - name: Configure Android SDK
        working-directory: .
        run: |
          echo "$HOME/.local/share/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$HOME/.local/share/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/.local/share/android-sdk" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        working-directory: .
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Finance-Hub-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
