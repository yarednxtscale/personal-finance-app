name: Patch active transaction query
on:
  push:
    branches: [main]
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[auto-patch-active-transactions]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch app.js
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text()
          old = "let q = supabase.from(table).select('*');\n      if (table === 'transactions') q = q.order('transaction_date', { ascending: false }).order('created_at', { ascending: false });"
          new = "let q = supabase.from(table).select('*').eq('is_deleted', false);\n      if (table === 'transactions') q = q.order('transaction_date', { ascending: false }).order('created_at', { ascending: false });"
          if old not in s:
              raise SystemExit('Expected app.js query block was not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git diff --cached --quiet || git commit -m 'fix: exclude trashed records from app data [auto-patch-active-transactions]'
          git push
